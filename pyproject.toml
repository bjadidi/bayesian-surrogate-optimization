[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-surrogate-optimization"
version = "0.1.0"
description = "Gaussian-process Bayesian optimization of an expensive process simulator, benchmarked against space-filling designs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Behrooz (Bruce) Jadidi" }]
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::sklearn.exceptions.ConvergenceWarning"]
